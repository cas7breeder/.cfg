# Set leader key
set -g prefix C-j

set-option -g status-position top
set -g default-terminal "screen-256color"

# Pane borders settings
set -g pane-border-lines double
set -g pane-active-border-style bg=default,fg=#2DA359
set -g pane-border-style fg=#3465A4

# Status bar options
set -g window-status-current-format "#I #W"
set -g window-status-format "#I #W#F"
set -g window-status-separator "    "
set -g status-left "#S    "
set -g status-right "#(whoami)@#H    %H:%M   %Y-%b-%d"

# Status bar colours
set -g status-style fg=#729FCF,bold,bg=default
set -g window-status-current-style fg=#2B2E34,bg=#2DA359
# Different green versions"#4EF484" "#39C36A" "#2DA359"
set -g status-left-style fg=white
set -g status-right-style fg=white

set -g mouse on
set -g base-index 1
set -g renumber-windows on
setw -g mode-keys vi
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

unbind R
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Reloading TMUX config"

unbind r
bind r command-prompt "rename-window %%"
unbind %
bind % command-prompt "rename-session %%"

# Open panes in current directory
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
bind h split-window -v -c "#{pane_current_path}"

unbind [
bind-key Space copy-mode

# Unbind leader+j/k/l navigation
unbind j
unbind k
unbind l

# Change active pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"

# Change windows using SHIFT + ALT + H/L
bind-key -n C-M-h previous-window
bind-key -n C-M-l next-window

# Move windows using SHIFT + ALT + H/L
bind-key -n M-H swap-window -t -1 \; previous-window
bind-key -n M-L swap-window -t +1 \; next-window

bind-key p last-window

bind-key a command-prompt -p "Swap window with:" "swap-window -t '%%'"


# Initialize tpack (keep this line at the very bottom of tmux.conf)
run 'tpack init'
