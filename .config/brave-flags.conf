--ozone-platform-hint=auto
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--num-raster-threads=8
--enable-native-gpu-memory-buffers
--disk-cache-dir=/tmp/brave-cache
--disk-cache-size=2147483647
--enable-features=AcceleratedVideoEncoder,InlineScriptCache,UsePersistentCacheForCodeCache,WaylandSessionManagement
--disable-features=Vulkan
